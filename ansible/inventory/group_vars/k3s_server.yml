---
# Cómo arranca K3s en el control plane. El rol docker_node usa este comando
# para el contenedor; con otro proveedor de nodos (VMs) se usaría igual.
k3s_command:
  - server
  - --node-name={{ inventory_hostname }}
  - --node-ip={{ node_ip }}
  - --tls-san={{ node_ip }}
  # El server queda dedicado al control plane: los pods de The Store van a los agents.
  - --node-taint=node-role.kubernetes.io/control-plane:NoSchedule
k3s_env:
  K3S_TOKEN: "{{ k3s_token }}"
# Puertos publicados en el host, solo con k3s_publish_ports (macOS). Van en el server
# porque nunca se retira: la API y la entrada HTTP de ServiceLB, que corre en todos los nodos.
node_published_ports: >-
  {{ ['127.0.0.1:6443:6443', '127.0.0.1:' ~ store_http_host_port ~ ':80']
     if k3s_publish_ports | bool else [] }}
