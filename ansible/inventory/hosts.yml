---
# Inventario del clúster: qué nodos existen, con su nombre, rol e IP en k3s-net.
# Para agregar un worker se suma (o se descomenta) una entrada en k3s_agents y se corre
# add-nodes.yml. Para retirarlo, remove-node.yml y después se comenta o se borra su entrada.
all:
  children:
    k3s_cluster:
      children:
        k3s_server:
          hosts:
            k3s-server:
              node_ip: 172.28.0.10
        k3s_agents:
          hosts:
            k3s-agent-1:
              node_ip: 172.28.0.11
            k3s-agent-2:
              node_ip: 172.28.0.12
            # k3s-agent-3:
            #   node_ip: 172.28.0.13
