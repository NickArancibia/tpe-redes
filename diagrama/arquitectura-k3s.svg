<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="910" viewBox="0 0 2000 910" font-family="DejaVu Sans, Verdana, sans-serif">
  <defs>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c98a22"/>
    </marker>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <rect width="2000" height="910" fill="#fff"/>

  <!-- Host -->
  <rect x="6" y="6" width="1540" height="896" rx="30" fill="none" stroke="#333" stroke-width="4"/>
  <text x="40" y="54" font-size="31" font-weight="bold" fill="#222">Host: Ubuntu 24.04 + Docker Engine</text>

  <!-- Ansible -->
  <rect x="40" y="82" width="938" height="140" rx="16" fill="#fde8c9" stroke="#d4952a" stroke-width="3"/>
  <text x="509" y="131" font-size="31" font-weight="bold" fill="#222" text-anchor="middle">Ansible: inventario + playbooks</text>
  <text x="509" y="171" font-size="25" fill="#8a5a14" text-anchor="middle">crear clúster · desplegar The Store</text>
  <text x="509" y="206" font-size="25" fill="#8a5a14" text-anchor="middle">agregar y quitar nodos · destruir</text>

  <!-- Ansible -> API de Kubernetes (server) -->
  <line x1="229" y1="222" x2="229" y2="356" stroke="#c98a22" stroke-width="5" marker-end="url(#a-orange)"/>
  <text x="250" y="250" font-size="25" fill="#9a6510">API de Kubernetes (HTTPS :6443):</text>
  <text x="250" y="284" font-size="25" fill="#9a6510">despliega, drena y verifica</text>

  <!-- Ansible -> Docker Engine (todos los nodos) -->
  <line x1="772" y1="222" x2="772" y2="298" stroke="#c98a22" stroke-width="5" marker-end="url(#a-orange)"/>
  <text x="792" y="250" font-size="25" fill="#9a6510">Docker Engine:</text>
  <text x="792" y="284" font-size="25" fill="#9a6510">crea y elimina los nodos</text>

  <!-- Red de los nodos -->
  <rect x="30" y="302" width="1492" height="580" rx="22" fill="none" stroke="#3b74e0" stroke-width="3" stroke-dasharray="14 9"/>

  <!-- k3s-server -->
  <rect x="58" y="360" width="342" height="430" rx="16" fill="#dce6fa" stroke="#3b74e0" stroke-width="3"/>
  <text x="229" y="410" font-size="31" font-weight="bold" fill="#1e3f8a" text-anchor="middle">k3s-server</text>
  <text x="229" y="450" font-size="26" fill="#1e3f8a" text-anchor="middle">172.28.0.10</text>
  <text x="229" y="486" font-size="25" fill="#1e3f8a" text-anchor="middle">server (control plane)</text>
  <rect x="94" y="516" width="270" height="62" rx="31" fill="#fff" stroke="#666" stroke-width="2.5"/>
  <text x="229" y="557" font-size="26" fill="#222" text-anchor="middle">API :6443</text>
  <text x="229" y="660" font-size="25" fill="#1e3f8a" text-anchor="middle">los agents se</text>
  <text x="229" y="694" font-size="25" fill="#1e3f8a" text-anchor="middle">unen al server</text>

  <!-- k3s-agent-1 -->
  <rect x="420" y="360" width="342" height="430" rx="16" fill="#e5f1e3" stroke="#3f8f3f" stroke-width="3"/>
  <text x="591" y="410" font-size="31" font-weight="bold" fill="#1f5c1f" text-anchor="middle">k3s-agent-1</text>
  <text x="591" y="450" font-size="26" fill="#1f5c1f" text-anchor="middle">172.28.0.11</text>
  <text x="591" y="486" font-size="25" fill="#1f5c1f" text-anchor="middle">agent (worker)</text>
  <rect x="456" y="516" width="270" height="62" rx="31" fill="#fff" stroke="#666" stroke-width="2.5"/>
  <text x="591" y="557" font-size="26" fill="#222" text-anchor="middle">Pods de The Store</text>
  <rect x="456" y="602" width="270" height="62" rx="31" fill="#fff" stroke="#666" stroke-width="2.5"/>
  <text x="591" y="643" font-size="26" fill="#222" text-anchor="middle">Traefik</text>

  <!-- k3s-agent-2 -->
  <rect x="782" y="360" width="342" height="430" rx="16" fill="#e5f1e3" stroke="#3f8f3f" stroke-width="3"/>
  <text x="953" y="410" font-size="31" font-weight="bold" fill="#1f5c1f" text-anchor="middle">k3s-agent-2</text>
  <text x="953" y="450" font-size="26" fill="#1f5c1f" text-anchor="middle">172.28.0.12</text>
  <text x="953" y="486" font-size="25" fill="#1f5c1f" text-anchor="middle">agent (worker)</text>
  <rect x="818" y="516" width="270" height="62" rx="31" fill="#fff" stroke="#666" stroke-width="2.5"/>
  <text x="953" y="557" font-size="26" fill="#222" text-anchor="middle">Pods de The Store</text>

  <!-- k3s-agent-3 (se agrega) -->
  <rect x="1144" y="360" width="342" height="430" rx="16" fill="#fff" stroke="#3f8f3f" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="1315" y="410" font-size="31" font-weight="bold" fill="#1f5c1f" text-anchor="middle">k3s-agent-3</text>
  <text x="1315" y="450" font-size="26" fill="#1f5c1f" text-anchor="middle">172.28.0.13</text>
  <text x="1315" y="486" font-size="25" fill="#1f5c1f" text-anchor="middle">nodo que se agrega</text>
  <rect x="1180" y="516" width="270" height="62" rx="31" fill="#fff" stroke="#888" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="1315" y="557" font-size="26" fill="#777" text-anchor="middle">Pods de The Store</text>

  <!-- Redes -->
  <text x="60" y="852" font-size="25" font-weight="bold" fill="#3b74e0">Pods: 10.42.0.0/16 (un /24 por nodo)</text>
  <text x="1494" y="852" font-size="25" font-weight="bold" fill="#3b74e0" text-anchor="end">172.28.0.0/24</text>

  <!-- GitHub Container Registry -->
  <rect x="1595" y="97" width="395" height="135" rx="16" fill="#f1f1f1" stroke="#555" stroke-width="3"/>
  <text x="1792" y="144" font-size="29" font-weight="bold" fill="#222" text-anchor="middle">GitHub Container</text>
  <text x="1792" y="180" font-size="29" font-weight="bold" fill="#222" text-anchor="middle">Registry</text>
  <text x="1792" y="214" font-size="24" fill="#444" text-anchor="middle">imágenes de la tienda</text>
  <polyline points="1595,163 1410,163 1410,298" fill="none" stroke="#444" stroke-width="4" stroke-dasharray="6 6" marker-end="url(#a-gray)"/>
  <text x="1390" y="250" font-size="25" fill="#333" text-anchor="end">pull de</text>
  <text x="1390" y="284" font-size="25" fill="#333" text-anchor="end">imágenes</text>

  <!-- Navegador -->
  <rect x="1595" y="574" width="395" height="120" rx="16" fill="#f1f1f1" stroke="#555" stroke-width="3"/>
  <text x="1792" y="621" font-size="29" font-weight="bold" fill="#222" text-anchor="middle">Navegador</text>
  <text x="1792" y="663" font-size="24" fill="#444" text-anchor="middle">cliente de la tienda</text>
  <line x1="1595" y1="634" x2="1526" y2="634" stroke="#444" stroke-width="5" marker-end="url(#a-gray)"/>
  <text x="1792" y="740" font-size="25" fill="#333" text-anchor="middle">HTTP :80</text>
</svg>
